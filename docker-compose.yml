services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dzencode-orders-products:latest
    environment:
      NUXT_PUBLIC_SOCKET_URL: ${PUBLIC_SOCKET_URL:-http://localhost:3001}
    ports:
      - '3000:3000'
    depends_on:
      - socket
    restart: unless-stopped

  socket:
    build:
      context: ./socket-server
      dockerfile: Dockerfile
    image: dzencode-socket-server:latest
    environment:
      SOCKET_PORT: 3001
      SOCKET_CORS_ORIGIN: ${SOCKET_CORS_ORIGIN:-*}
    ports:
      - '3001:3001'
    restart: unless-stopped
